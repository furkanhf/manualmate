[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manualmate"
version = "0.1.0"
description = "Multimodal, multilingual RAG assistant for product manuals"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manualmate = ["index/schema.sql"]
