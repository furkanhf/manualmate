# Names that users type for each manual. The query parser (retrieve/query_parser.py)
# uses this file to find WHICH manual a question is about.
#
# How model names match (all text is lowercased; "-", "/", "." and spaces are removed):
#   - A model alias matches a word of the question if they are equal, or if one starts
#     with the other and the shorter one has at least 4 characters.
#     Example: alias "ftks35kvma" matches the user word "ftks35" and "ftks35kvma".
#   - Two neighbouring words are also tried together: "archer c6" -> "archerc6".
#   - The LONGEST match wins. "kgn56" (rf_004) beats "kgn" (rf_002).
#   - If two manuals have the same best match (user wrote "ftks35", which is in both
#     Daikin K and L manuals), the router returns both and asks the user.
#
# Add a new manual: copy one block, change the id, brand, category and models.
# Model names come from the cover page of the manual (the model list on page 1).

